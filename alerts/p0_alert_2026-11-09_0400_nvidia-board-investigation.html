<h1>🚨 P0 · 英伟达董事会宣布启动独立调查：黄仁勋成为外国情报行动目标</h1>
<p class="time">发生时间：2026-11-09 04:00（北京时间；声明发布时间 2026-11-08 20:00 GMT）</p>
<p>英伟达董事会宣布启动独立调查，回应近期报道称创始人兼 CEO 黄仁勋成为外国情报行动的目标。调查由独立董事委员会主持、外聘独立律师协助；董事会表示目前没有理由相信国家安全或英伟达机密已遭泄露，黄仁勋全力支持调查，董事会对其领导层表示信任。</p>
