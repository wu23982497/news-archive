<h1>P0 提醒：特朗普称美方暂无立即打击伊朗计划</h1>
<p class="meta">发生时间：2026年11月4日约 07:51（上海时间，即路透 11月3日 23:51 UTC 发布；采访为美东 11月3日周二）</p>
<p>美国总统特朗普在接受《金融时报》电话采访时表示，美方暂无立即打击伊朗的计划，对当前对峙局面表示满意，称“我们似乎正在得到我们想要的一切”；同时称美军“已做好准备，如有需要可以行动，但可能没有理由这么做”，并称与伊朗的间接谈判仍在继续。</p>
